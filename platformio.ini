; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html


; ================================================================
; Gemeinsame Einstellungen
; ================================================================

[common]

;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_filters =
    esp32_exception_decoder
    direct

monitor_speed = 115200
upload_speed = 921600

test_framework = unity

build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOARD_HAS_PSRAM
    -D AUDIOSTREAM_ENABLE_DYNAMIC_LIFETIME

build_src_flags =
    -Wall
    -Wextra
    -O2


; ================================================================
; ESP32 Audio Kit
; ================================================================

[env:esp32-audio-kit]

platform = ${common.platform}
framework = ${common.framework}

board = esp32dev

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
test_framework = ${common.test_framework}

board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    ${common.build_flags}
    -mfix-esp32-psram-cache-issue
    -DSOFTCODEC_METRICS=1

build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_ES8388
    -D PIN_I2C_SCL=32
    -D PIN_I2C_SDA=33
    -D PIN_AMPLIFIER=21
    -D PIN_AMPLIFIER_ACTIVE=HIGH

    -D PIN_I2S_BLCK=27
    -D PIN_I2S_WS=25
    -D PIN_I2S_DOUT=26
    -D PIN_I2S_MLCK=0

    ; ESP32-A1S Audio Kit onboard microSD card (SD_MMC, 4-bit)
    -D PIN_SD_MMC_CLK=14
    -D PIN_SD_MMC_CMD=15
    -D PIN_SD_MMC_D0=2
    -D PIN_SD_MMC_D1=4
    -D PIN_SD_MMC_D2=12
    -D PIN_SD_MMC_D3=13


; ================================================================
; Freenove ESP32-S3 Display 2.8"
; ================================================================

[env:freenove_esp32_s3_display]

framework = ${common.framework}
platform = ${common.platform}
board = esp32-s3-devkitc-1

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

test_framework = ${common.test_framework}

; ESP32-S3 / N16R8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_ES8311
    -D PIN_I2C_SCL=15
    -D PIN_I2C_SDA=16

    -D PIN_AMPLIFIER=1
    -D PIN_AMPLIFIER_ACTIVE=LOW

    -D PIN_I2S_BLCK=5
    -D PIN_I2S_WS=7
    -D PIN_I2S_DOUT=8
    -D PIN_I2S_MLCK=4
    -D SPDIF_DATA_PIN=44

    ; Freenove ESP32-S3 Display 2.8" (FNK0104A) microSD, SD_MMC 4-bit
    -D PIN_SD_MMC_CLK=38
    -D PIN_SD_MMC_CMD=40
    -D PIN_SD_MMC_D0=39
    -D PIN_SD_MMC_D1=41
    -D PIN_SD_MMC_D2=48
    -D PIN_SD_MMC_D3=47



; ================================================================
; Freenove ESP32-S3 Display 2.8"       +++ USB AUDIO +++
; ================================================================
;
; Experimental USB Audio test environment: ESP32-S3 TinyUSB UAC1, 16-bit stereo
; PCM at 48 kHz. Enable UAC_SPK_STEREO for AudioInputUSB host playback and/or
; UAC_MIC_STEREO for AudioOutputUSB capture; no sample-rate conversion is done.
;
; Keep the platform pinned to pioarduino 55.03.312-1 (Arduino-ESP32 3.3.12)
; while using the framework patch below. The patch matches the USBAudioCard.cpp
; descriptor code in this specific framework version. When changing versions,
; review the patch and retest USB enumeration before updating this pin.

[env:freenove_esp32_s3_display_USBAUDIO]

framework = ${common.framework}
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

test_framework = ${common.test_framework}

; Windows composite-device workaround:
; Add an Audio Interface Association Descriptor (IAD) so Windows groups the
; UAC1 AudioControl + AudioStreaming interfaces as one audio function alongside
; CDC serial. This is a version-specific build-time patch to the installed
; Arduino-ESP32 framework package, not a change to the library source itself.
; The script deliberately fails if the expected framework code is not found.
; Other host OSes or USB configurations may not need this workaround.
extra_scripts = pre:scripts/patch_uac1_audio_iad.py

; ESP32-S3 / N16R8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Upload/monitor settings for native USB.
; Leave monitor_port unset to avoid tying this config to one PC's COM-port number.
; If automatic port detection is unreliable, uncomment and change the example below.
;monitor_port = COM13
; DTR/RTS and 1200-bps touch help PlatformIO reset/boot into upload mode.
; Adapt these if your board needs different serial-control-line behavior.
monitor_dtr = 1
monitor_rts = 1
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; Select TinyUSB (USB_MODE=0) rather than the ESP32-S3 USB-Serial/JTAG mode.
; Remove the board/platform's default definition first to prevent conflicting
; USB_MODE values. CDC_ON_BOOT=0 prevents automatic early CDC startup: the sketch
; registers USBAudioCard/CDC interfaces and starts the composite USB device itself.
build_unflags =
    -DARDUINO_USB_MODE

build_flags =
    ${common.build_flags}
    ; Expose Arduino-ESP32's FS headers to this PlatformIO build.
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Keep the AudioStream compile-time default at the USB test rate. The graph,
    ; decoder and USBAudioCard must agree on 48 kHz; no resampling is done here.
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f

; These remaining flags describe the Freenove board's codec, pins and SD wiring;
; they are board configuration, not requirements for the USB audio endpoint itself.
build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_NONE
    -D AUDIO_OUTPUT_USB
    ; Route Serial in the sketch to manager-owned USB CDC; UART0 remains Serial0.
  ; -D AUDIO_USB_REDIRECT_SERIAL
    -D PIN_I2C_SCL=15
    -D PIN_I2C_SDA=16

    -D PIN_AMPLIFIER=1
    -D PIN_AMPLIFIER_ACTIVE=LOW

    -D PIN_I2S_BLCK=5
    -D PIN_I2S_WS=7
    -D PIN_I2S_DOUT=8
    -D PIN_I2S_MLCK=4
    -D SPDIF_DATA_PIN=44

    ; Freenove ESP32-S3 Display 2.8" (FNK0104A) microSD, SD_MMC 4-bit
    -D PIN_SD_MMC_CLK=38
    -D PIN_SD_MMC_CMD=40
    -D PIN_SD_MMC_D0=39
    -D PIN_SD_MMC_D1=41
    -D PIN_SD_MMC_D2=48
    -D PIN_SD_MMC_D3=47


; ================================================================
; Waveshare ESP32-P4-Pico
; ES8311 codec + NS4150B speaker amplifier
; Pin mapping taken from the Waveshare ESP32-P4-Pico schematic.
; Note: DOUT/DIN are named from the ESP32-P4 perspective.
; https://www.waveshare.com/wiki/ESP32-P4-Pico
; ================================================================

[env:esp32-p4-pico]

platform = ${common.platform}
framework = ${common.framework}

; Keep the same P4 board/platform baseline as the generic P4 environment.
board = esp32-p4

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

test_framework = ${common.test_framework}

board_build.mcu = esp32p4
board_build.f_cpu = 400000000L
; Older revisions
;board_build.f_cpu = 360000000L

build_flags =
    ${common.build_flags}

build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_ES8311

    ; ES8311 control bus: SDA=GPIO7, SCL=GPIO8
    -D PIN_I2C_SDA=7
    -D PIN_I2C_SCL=8

    ; NS4150B speaker amplifier enable: GPIO53, active HIGH
    -D PIN_AMPLIFIER=53
    -D PIN_AMPLIFIER_ACTIVE=HIGH

    ; I2S: ESP32-P4 -> ES8311 DSDIN uses GPIO9
    -D PIN_I2S_BLCK=12
    -D PIN_I2S_WS=10
    -D PIN_I2S_DOUT=9
    -D PIN_I2S_MLCK=13

    ; ES8311 ASDOUT -> ESP32-P4 input, for audio capture
    -D PIN_I2S_DIN=11

