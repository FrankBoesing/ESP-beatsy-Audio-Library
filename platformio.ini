; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html


; ================================================================
; Gemeinsame Einstellungen
; ================================================================

[common]

;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_filters =
    esp32_exception_decoder
    direct

monitor_speed = 115200
upload_speed = 921600

test_framework = unity

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOARD_HAS_PSRAM
    -D AUDIOSTREAM_ENABLE_DYNAMIC_LIFETIME

build_src_flags =
    -Wall
    -Wextra
    -O2


; ================================================================
; ESP32 Audio Kit
; ================================================================

[env:esp32-audio-kit]

platform = ${common.platform}
framework = ${common.framework}

board = esp32dev

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
test_framework = ${common.test_framework}

board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    ${common.build_flags}
    -mfix-esp32-psram-cache-issue
    -DSOFTCODEC_METRICS=1

build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_ES8388
    -D PIN_I2C_SCL=32
    -D PIN_I2C_SDA=33
    -D PIN_AMPLIFIER=21
    -D PIN_AMPLIFIER_ACTIVE=HIGH

    -D PIN_I2S_BLCK=27
    -D PIN_I2S_WS=25
    -D PIN_I2S_DOUT=26
    -D PIN_I2S_MLCK=0

    ; ESP32-A1S Audio Kit onboard microSD card (SD_MMC 4-bit; helicopter test)
    -D PIN_SD_MMC_CLK=14
    -D PIN_SD_MMC_CMD=15
    -D PIN_SD_MMC_D0=2
    -D PIN_SD_MMC_D1=4
    -D PIN_SD_MMC_D2=12
    -D PIN_SD_MMC_D3=13

    ; Legacy SPI SD pins retained for examples not yet migrated
    -D PIN_SD_CS=13
    -D PIN_SPI_MOSI=15
    -D PIN_SPI_MISO=2
    -D PIN_SPI_SCK=14


; ================================================================
; Freenove ESP32-S3 Display 2.8"
; ================================================================

[env:freenove_esp32_s3_display]

; Arduino-ESP32 3.3.8+ provides USBAudioCard with TinyUSB Audio support.
; Pin the platform release to Arduino-ESP32 3.3.11, which includes USBAudioCard.h (USB Audio was added in 3.3.8).
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = ${common.framework}
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = ${common.platform}

board = esp32-s3-devkitc-1
; Replace the board's default USB_MODE=1 instead of defining it again in build_flags.
;board_build.extra_flags = -DARDUINO_ESP32S3_DEV -DARDUINO_USB_MODE=0 -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

test_framework = ${common.test_framework}

; ESP32-S3 / N16R8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = default_16MB.csv

build_flags =
    ${common.build_flags}
    ; Do not auto-start TinyUSB before USBAudioCard registers its interface.
    ; output_usb.cpp registers a composite CDC + USB Audio device, then calls USB.begin().
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ;-D AUDIO_USB_REQUIRE_ARDUINO_UAC=1

build_src_flags =
    ${common.build_src_flags}
    -D AUDIO_CODEC_ES8311
    -D PIN_I2C_SCL=15
    -D PIN_I2C_SDA=16

    -D PIN_AMPLIFIER=1
    -D PIN_AMPLIFIER_ACTIVE=LOW

    -D PIN_I2S_BLCK=5
    -D PIN_I2S_WS=7
    -D PIN_I2S_DOUT=8
    -D PIN_I2S_MLCK=4
    -D SPDIF_DATA_PIN=44

    ; Freenove ESP32-S3 Display 2.8" (FNK0104A) microSD, SD_MMC 4-bit
    -D PIN_SD_MMC_CLK=38
    -D PIN_SD_MMC_CMD=40
    -D PIN_SD_MMC_D0=39
    -D PIN_SD_MMC_D1=41
    -D PIN_SD_MMC_D2=48
    -D PIN_SD_MMC_D3=47

    ; Legacy SPI SD pins retained for examples not yet migrated
    -D PIN_SD_CS=10
    -D PIN_SPI_MOSI=11
    -D PIN_SPI_MISO=13
    -D PIN_SPI_SCK=12

; ================================================================
; Generic ESP32-P4
; Uses the pioarduino platform, which provides ESP32-P4 support.
; For the ESP32-P4 Function EV Board, use board = esp32-p4-evboard.
; ================================================================

[env:esp32-p4]

platform = ${common.platform}
framework = ${common.framework}

board = esp32-p4

monitor_filters = ${common.monitor_filters}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

test_framework = ${common.test_framework}

board_build.mcu = esp32p4
board_build.f_cpu = 360000000L

build_flags =
    ${common.build_flags}

build_src_flags =
    ${common.build_src_flags}
    -D SPDIF_DATA_PIN=44
